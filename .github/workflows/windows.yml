name: Windows build

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # libVLC is bundled in the app: take it from the official 64-bit zip
      - name: Fetch VLC
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.videolan.org/pub/videolan/vlc/3.0.21/win64/vlc-3.0.21-win64.zip -OutFile vlc.zip
          Expand-Archive vlc.zip -DestinationPath vlc
          echo "VLC_DIR=$PWD\vlc\vlc-3.0.21" >> $env:GITHUB_ENV

      - name: Build installer
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: gradle :app-desktop:packageExe

      - uses: actions/upload-artifact@v4
        with:
          name: lecteur-media-windows
          path: app-desktop/build/compose/binaries/main/exe/*.exe
